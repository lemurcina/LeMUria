name: Hardhat CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tasks/**"
      - "test/**"
      - "hardhat.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/hardhat.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "tasks/**"
      - "test/**"
      - "hardhat.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/hardhat.yml"

permissions:
  contents: read

concurrency:
  group: hardhat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTENV_CONFIG_PATH: ./.env.example
      HARDHAT_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Compile contracts
        run: yarn compile
      - name: Test contracts
        run: yarn test
